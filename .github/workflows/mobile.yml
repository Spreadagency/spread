name: Mobile app

# Spread AI mobile app (mobile-app/): checks + a testable Android APK on every change,
# and optional EAS cloud builds (release APK / Play AAB / iOS) when EXPO_TOKEN is configured.
on:
  push:
    paths: ['mobile-app/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['mobile-app/**', '.github/workflows/mobile.yml']
  workflow_dispatch:
    inputs:
      eas_profile:
        description: 'EAS build profile (preview = installable APK + iOS ad-hoc, production = AAB + App Store)'
        required: false
        default: 'none'
        type: choice
        options: ['none', 'preview', 'production', 'simulator']
      eas_platform:
        description: 'EAS platform'
        required: false
        default: 'all'
        type: choice
        options: ['all', 'android', 'ios']

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile-app

jobs:
  checks:
    name: Typecheck · lint · tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint
      - run: npx jest --ci
      - name: Validate app config
        run: npx expo config --type public > /dev/null

  android-apk:
    name: Android APK (test build, no store signing)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write   # publish the pre-release with the APK
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Generate native Android project (Continuous Native Generation)
        run: npx expo prebuild --platform android --no-install --clean
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://ai.spreadagency.net' }}
          EXPO_PUBLIC_PURCHASES: 'off'
      - name: Build standalone release APK (signed with the Android debug key — for testing only)
        working-directory: mobile-app/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://ai.spreadagency.net' }}
          EXPO_PUBLIC_PURCHASES: 'off'
          NODE_ENV: production
      - name: Verify APK is standalone (JS bundle embedded) and name it
        id: apk
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          unzip -l "$APK" | grep -q 'assets/index.android.bundle' || { echo "::error::JS bundle missing from APK"; exit 1; }
          VER=$(node -p "require('./app.json').expo.version")
          OUT="spread-ai-${VER}-${GITHUB_SHA::7}.apk"
          cp "$APK" "$OUT"
          echo "file=mobile-app/$OUT" >> "$GITHUB_OUTPUT"
          echo "name=$OUT" >> "$GITHUB_OUTPUT"
          ls -la "$OUT"; sha256sum "$OUT"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: spread-ai-android-test-apk
          path: ${{ steps.apk.outputs.file }}
          retention-days: 14
      - name: Publish as pre-release "android-test-latest" (direct install link)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-test-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create android-test-latest "${{ steps.apk.outputs.name }}" \
            --target "$GITHUB_SHA" --prerelease \
            --title "Spread AI — Android test APK (${GITHUB_SHA::7})" \
            --notes "Test build from \`${GITHUB_REF_NAME}\` @ ${GITHUB_SHA::7}. Signed with the Android debug key — for testing only, not for Google Play. Install: open this page on the phone, download the APK, allow 'Install unknown apps'."

  android-aab:
    name: Android AAB (Google Play, upload-key signed)
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write   # publish the pre-release with the AAB
    env:
      UPLOAD_KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
      UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
    steps:
      - name: Check upload-key secrets
        id: key
        working-directory: .   # runs before checkout, so mobile-app/ doesn't exist yet
        run: |
          if [ -z "$UPLOAD_KEYSTORE_B64" ] || [ -z "$UPLOAD_KEYSTORE_PASSWORD" ]; then
            echo "::notice::Skipping the Play AAB: add the ANDROID_UPLOAD_KEYSTORE_BASE64 and ANDROID_UPLOAD_KEYSTORE_PASSWORD secrets (docs/04-build-and-release.md §1a)."
            echo "ok=0" >> "$GITHUB_OUTPUT"
          else
            echo "ok=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.ok == '1'
      - uses: actions/setup-node@v4
        if: steps.key.outputs.ok == '1'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json
      - uses: actions/setup-java@v4
        if: steps.key.outputs.ok == '1'
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.key.outputs.ok == '1'
      - run: npm ci
        if: steps.key.outputs.ok == '1'
      - name: Set versionCode from the run number (Play needs it to grow on every upload)
        if: steps.key.outputs.ok == '1'
        run: |
          node -e '
            const fs = require("fs"); const p = "app.json"; const j = JSON.parse(fs.readFileSync(p, "utf8"));
            j.expo.android.versionCode = Number(process.env.GITHUB_RUN_NUMBER) + 100;
            fs.writeFileSync(p, JSON.stringify(j, null, 2));
            console.log("version", j.expo.version, "versionCode", j.expo.android.versionCode);'
      - name: Generate native Android project
        if: steps.key.outputs.ok == '1'
        run: npx expo prebuild --platform android --no-install --clean
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://ai.spreadagency.net' }}
          EXPO_PUBLIC_PURCHASES: 'off'
      - name: Build signed release bundle
        if: steps.key.outputs.ok == '1'
        working-directory: mobile-app/android
        run: |
          echo "$UPLOAD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.keystore" \
            -Pandroid.injected.signing.store.password="$UPLOAD_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias=upload \
            -Pandroid.injected.signing.key.password="$UPLOAD_KEYSTORE_PASSWORD"
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://ai.spreadagency.net' }}
          EXPO_PUBLIC_PURCHASES: 'off'
          NODE_ENV: production
      - name: Verify the bundle is signed with the upload key (not the debug key) and name it
        if: steps.key.outputs.ok == '1'
        id: aab
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          unzip -l "$AAB" | grep -q 'base/assets/index.android.bundle' || { echo "::error::JS bundle missing from AAB"; exit 1; }
          WANT=$(keytool -list -v -keystore "$RUNNER_TEMP/upload.keystore" -storepass "$UPLOAD_KEYSTORE_PASSWORD" -alias upload | grep -m1 'SHA256:' | awk '{print $2}')
          GOT=$(keytool -printcert -jarfile "$AAB" | grep -m1 'SHA256:' | awk '{print $2}')
          echo "upload key SHA256: $WANT"; echo "bundle cert SHA256: $GOT"
          [ -n "$WANT" ] && [ "$WANT" = "$GOT" ] || { echo "::error::AAB is not signed with the upload key"; exit 1; }
          rm -f "$RUNNER_TEMP/upload.keystore"
          VER=$(node -p "require('./app.json').expo.version")
          CODE=$(node -p "require('./app.json').expo.android.versionCode")
          OUT="spread-ai-${VER}-${CODE}.aab"
          cp "$AAB" "$OUT"
          echo "file=mobile-app/$OUT" >> "$GITHUB_OUTPUT"
          echo "name=$OUT" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          ls -la "$OUT"; sha256sum "$OUT"
      - name: Upload AAB
        if: steps.key.outputs.ok == '1'
        uses: actions/upload-artifact@v4
        with:
          name: spread-ai-play-aab
          path: ${{ steps.aab.outputs.file }}
          retention-days: 30
      - name: Publish as pre-release "android-play-latest"
        if: steps.key.outputs.ok == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-play-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create android-play-latest "${{ steps.aab.outputs.name }}" \
            --target "$GITHUB_SHA" --prerelease \
            --title "Spread AI — Google Play AAB (versionCode ${{ steps.aab.outputs.code }})" \
            --notes "Upload this .aab to Google Play Console (Testing → Internal testing → Create release). Signed with the Spread AI upload key; Play App Signing re-signs it for users. Built from \`${GITHUB_REF_NAME}\` @ ${GITHUB_SHA::7}."

  ios-ipa:
    name: iOS IPA (unsigned, for sideloading tests)
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write   # publish the pre-release with the IPA
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json
      - run: npm ci
      - name: Generate native iOS project (runs pod install)
        run: npx expo prebuild --platform ios --clean
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://ai.spreadagency.net' }}
          EXPO_PUBLIC_PURCHASES: 'off'
      - name: Build Release for iPhone without code signing
        id: build
        working-directory: mobile-app/ios
        run: |
          xcodebuild -version
          WS=$(ls -d *.xcworkspace | head -1); SCHEME="${WS%.xcworkspace}"
          echo "workspace=$WS scheme=$SCHEME"
          set -o pipefail
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -n 80
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://ai.spreadagency.net' }}
          EXPO_PUBLIC_PURCHASES: 'off'
          NODE_ENV: production
      - name: Package IPA and verify the JS bundle is embedded
        id: ipa
        run: |
          APP=$(ls -d ios/build/Build/Products/Release-iphoneos/*.app | head -1)
          [ -f "$APP/main.jsbundle" ] || { echo "::error::main.jsbundle missing from the .app"; exit 1; }
          VER=$(node -p "require('./app.json').expo.version")
          OUT="spread-ai-${VER}-${GITHUB_SHA::7}-unsigned.ipa"
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qry "$OUT" Payload
          echo "file=mobile-app/$OUT" >> "$GITHUB_OUTPUT"
          echo "name=$OUT" >> "$GITHUB_OUTPUT"
          ls -la "$OUT"; shasum -a 256 "$OUT"
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: spread-ai-ios-unsigned-ipa
          path: ${{ steps.ipa.outputs.file }}
          retention-days: 14
      - name: Publish as pre-release "ios-test-latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ios-test-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create ios-test-latest "${{ steps.ipa.outputs.name }}" \
            --target "$GITHUB_SHA" --prerelease \
            --title "Spread AI — iPhone test IPA, unsigned (${GITHUB_SHA::7})" \
            --notes "Unsigned test build from \`${GITHUB_REF_NAME}\` @ ${GITHUB_SHA::7}. Install it with Sideloadly or AltStore using your Apple ID; they sign it on your computer. A free Apple ID's signature expires after 7 days. Not for the App Store; use the TestFlight job for that."

  ios-testflight:
    name: iOS → TestFlight (App Store Connect API key)
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 75
    env:
      ASC_KEY_P8_B64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
      ASC_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Check Apple secrets
        id: key
        working-directory: .   # runs before checkout
        run: |
          if [ -z "$ASC_KEY_P8_B64" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::notice::Skipping TestFlight: add APPLE_API_KEY_P8_BASE64, APPLE_API_KEY_ID, APPLE_API_ISSUER_ID and APPLE_TEAM_ID (docs/04-build-and-release.md §1b)."
            echo "ok=0" >> "$GITHUB_OUTPUT"
          else
            echo "ok=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.ok == '1'
      - uses: actions/setup-node@v4
        if: steps.key.outputs.ok == '1'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json
      - run: npm ci
        if: steps.key.outputs.ok == '1'
      - name: Set team and build number (App Store Connect needs it to grow on every upload)
        if: steps.key.outputs.ok == '1'
        run: |
          node -e '
            const fs = require("fs"); const p = "app.json"; const j = JSON.parse(fs.readFileSync(p, "utf8"));
            j.expo.ios.buildNumber = String(Number(process.env.GITHUB_RUN_NUMBER) + 100);
            j.expo.ios.appleTeamId = process.env.APPLE_TEAM_ID;
            fs.writeFileSync(p, JSON.stringify(j, null, 2));
            console.log("version", j.expo.version, "buildNumber", j.expo.ios.buildNumber);'
      - name: Generate native iOS project (runs pod install)
        if: steps.key.outputs.ok == '1'
        run: npx expo prebuild --platform ios --clean
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://ai.spreadagency.net' }}
          EXPO_PUBLIC_PURCHASES: 'off'
      - name: Archive, sign (cloud-managed, automatic) and upload to App Store Connect
        if: steps.key.outputs.ok == '1'
        working-directory: mobile-app/ios
        run: |
          KEY="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          echo "$ASC_KEY_P8_B64" | base64 -d > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          WS=$(ls -d *.xcworkspace | head -1); SCHEME="${WS%.xcworkspace}"
          set -o pipefail
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/app.xcarchive" \
            "${AUTH[@]}" archive | tail -n 80
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            "${AUTH[@]}" | tail -n 40
          rm -f "$KEY"
          echo "::notice::Uploaded. The build appears in App Store Connect → TestFlight after Apple finishes processing (usually 5–30 min)."
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://ai.spreadagency.net' }}
          EXPO_PUBLIC_PURCHASES: 'off'
          NODE_ENV: production

  eas-build:
    name: EAS cloud build (${{ inputs.eas_profile }})
    needs: checks
    if: github.event_name == 'workflow_dispatch' && inputs.eas_profile != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Require EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add an EXPO_TOKEN repository secret (expo.dev → Account settings → Access tokens) to run EAS builds."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Start EAS build (artifacts appear on expo.dev → Builds)
        run: eas build --platform ${{ inputs.eas_platform }} --profile ${{ inputs.eas_profile }} --non-interactive --no-wait
