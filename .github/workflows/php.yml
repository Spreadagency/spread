name: PHP Composer

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # The platform has no Composer dependencies yet; skip the rest until a composer.json is added.
    - name: Check for composer.json
      id: composer
      run: |
        if [ -f composer.json ]; then
          echo "present=1" >> "$GITHUB_OUTPUT"
        else
          echo "::notice::No composer.json in the repository; skipping Composer validate/install."
          echo "present=0" >> "$GITHUB_OUTPUT"
        fi

    - name: Validate composer.json and composer.lock
      if: steps.composer.outputs.present == '1'
      run: composer validate --strict

    - name: Cache Composer packages
      if: steps.composer.outputs.present == '1'
      id: composer-cache
      uses: actions/cache@v3
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-

    - name: Install dependencies
      if: steps.composer.outputs.present == '1'
      run: composer install --prefer-dist --no-progress

    # Add a test script to composer.json, for instance: "test": "vendor/bin/phpunit"
    # Docs: https://getcomposer.org/doc/articles/scripts.md

    # - name: Run test suite
    #   run: composer run-script test
